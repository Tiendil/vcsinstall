version = 1

#############################
# Relation: tested_by / tests
#############################

[[relations]]
id = "tested_by"
description = "Tests that verify the artifact."

[[relations]]
id = "tests"
description = "Artifacts verified by the test."

# Package initializers are verified by matching tests/test_init.py files.
[[rules]]
relation = "tested_by"
input = { type = "glob", pattern = "./vcsinstall/{**package_path}/__init__.py" }
output = { type = "files", pattern = "./vcsinstall/{package_path}/tests/test_init.py" }

# Regular Python modules are verified by sibling tests/test_<module>.py files.
[[rules]]
relation = "tested_by"
input = { type = "all", items = [
  { type = "glob", pattern = "./vcsinstall/{**package_path}/{*module}.py" },
  { type = "not", item = { type = "glob", pattern = "./vcsinstall/**/__init__.py" } },
] }
output = { type = "files", pattern = "./vcsinstall/{package_path}/tests/test_{module}.py" }

# tests/test_init.py maps back to the package initializer it verifies.
[[rules]]
relation = "tests"
input = { type = "glob", pattern = "./vcsinstall/{**package_path}/tests/test_init.py" }
output = { type = "list", artifacts = ["./vcsinstall/{package_path}/__init__.py"] }

# tests/test_<module>.py maps back to the module it verifies.
[[rules]]
relation = "tests"
input = { type = "all", items = [
  { type = "glob", pattern = "./vcsinstall/{**package_path}/tests/test_{*module}.py" },
  { type = "not", item = { type = "glob", pattern = "./vcsinstall/**/tests/test_init.py" } },
] }
output = { type = "list", artifacts = ["./vcsinstall/{package_path}/{module}.py"] }

################################
# Relation: governed_by / governs
################################

[[relations]]
id = "governed_by"
description = "Specifications that apply to the artifact."

[[relations]]
id = "governs"
description = "Artifacts governed by the specification."

# Every specification document is governed by the general specification rules.
# Note: general.md governs itself too.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "./specs/**/*.md" }
output = { type = "list", artifacts = ["./specs/meta/general.md"] }

# The general specification rules govern every specification document.
# Note: general.md governs itself too.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/meta/general.md"] }
output = { type = "files", pattern = "./specs/**/*.md" }

# Behavior specifications are also governed by the behavior specification rules.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "./specs/behavior/**/*.md" }
output = { type = "list", artifacts = ["./specs/meta/behavior.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/meta/behavior.md"] }
output = { type = "files", pattern = "./specs/behavior/**/*.md" }

# Python files are governed by every architecture spec.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "./vcsinstall/**/*.py" }
output = { type = "files", pattern = "./specs/architecture/*.md" }

# Architecture mapping configuration follows the module layout.
[[rules]]
relation = "governed_by"
input = { type = "one_of", artifacts = [
  "./tach.toml",
  "./depmesh.toml",
] }
output = { type = "list", artifacts = ["./specs/architecture/modules_layout.md"] }

# Architecture specs govern every Python file.
[[rules]]
relation = "governs"
input = { type = "glob", pattern = "./specs/architecture/*.md" }
output = { type = "files", pattern = "./vcsinstall/**/*.py" }

# The module layout spec also governs architecture mapping configuration.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/architecture/modules_layout.md"] }
output = { type = "list", artifacts = [
  "./tach.toml",
  "./depmesh.toml",
] }

# Module behavior governance covers Python code and selected fixture formats.
# Core and domain retain the global architecture rules; add behavior scopes
# for shared concepts when their implementations are introduced.

# Project invariants and local content inspection follow the locking contract.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "./vcsinstall/project/**/*.py" },
  { type = "glob", pattern = "./vcsinstall/filesystem/**/*.py" },
] }
output = { type = "list", artifacts = ["./specs/behavior/locking.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/behavior/locking.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "./vcsinstall/project/**/*.py" },
  { type = "files", pattern = "./vcsinstall/filesystem/**/*.py" },
] }

# Workspace code and fixtures implement the persisted project formats.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "./vcsinstall/workspace/**/*.py" },
  { type = "glob", pattern = "./vcsinstall/workspace/**/fixtures/**/*.toml" },
] }
output = { type = "list", artifacts = [
  "./specs/behavior/config.md",
  "./specs/behavior/lockfile.md",
] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = [
  "./specs/behavior/config.md",
  "./specs/behavior/lockfile.md",
] }
output = { type = "union", items = [
  { type = "files", pattern = "./vcsinstall/workspace/**/*.py" },
  { type = "files", pattern = "./vcsinstall/workspace/**/fixtures/**/*.toml" },
] }

# Cache code follows the repository cache contract.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "./vcsinstall/cache/**/*.py" }
output = { type = "list", artifacts = ["./specs/behavior/cache.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/behavior/cache.md"] }
output = { type = "files", pattern = "./vcsinstall/cache/**/*.py" }

# Source and hosting code and specific specs follow the common contract.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "./vcsinstall/sources/**/*.py" },
  { type = "glob", pattern = "./vcsinstall/hosting/**/*.py" },
  { type = "glob", pattern = "./specs/behavior/vcs/**/*.md" },
  { type = "glob", pattern = "./specs/behavior/hosting/**/*.md" },
] }
output = { type = "list", artifacts = ["./specs/behavior/vcs-interaction.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/behavior/vcs-interaction.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "./vcsinstall/sources/**/*.py" },
  { type = "files", pattern = "./vcsinstall/hosting/**/*.py" },
  { type = "files", pattern = "./specs/behavior/vcs/**/*.md" },
  { type = "files", pattern = "./specs/behavior/hosting/**/*.md" },
] }

# Runtime coordinates command outcomes and the project operation contracts.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "./vcsinstall/runtime/**/*.py" }
output = { type = "list", artifacts = [
  "./specs/behavior/cli.md",
  "./specs/behavior/locking.md",
  "./specs/behavior/config.md",
  "./specs/behavior/lockfile.md",
  "./specs/behavior/cache.md",
  "./specs/behavior/vcs-interaction.md",
] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = [
  "./specs/behavior/cli.md",
  "./specs/behavior/locking.md",
  "./specs/behavior/config.md",
  "./specs/behavior/lockfile.md",
  "./specs/behavior/cache.md",
  "./specs/behavior/vcs-interaction.md",
] }
output = { type = "files", pattern = "./vcsinstall/runtime/**/*.py" }

# Adapter-specific contracts govern the named implementation and its tests.

# The git source adapter follows its source contract.
[[rules]]
relation = "governed_by"
input = { type = "one_of", artifacts = [
  "./vcsinstall/sources/adapters/git.py",
  "./vcsinstall/sources/adapters/tests/test_git.py",
] }
output = { type = "list", artifacts = ["./specs/behavior/vcs/git.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/behavior/vcs/git.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "./vcsinstall/sources/adapters/git.py" },
  { type = "files", pattern = "./vcsinstall/sources/adapters/tests/test_git.py" },
] }

# The filesystem source adapter follows its source contract.
