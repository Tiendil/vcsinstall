# CLI and skill-facing code is governed by the CLI behavior spec.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "./vcsinstall/cli/**/*.py" },
  { type = "glob", pattern = "./vcsinstall/skills/**/*.py" },
  { type = "glob", pattern = "./vcsinstall/skills/**/*.md" },
  { type = "one_of", artifacts = [
    "./vcsinstall/__init__.py",
    "./vcsinstall/__main__.py",
  ] },
] }
output = { type = "list", artifacts = ["./specs/behavior/cli.md"] }

# The CLI behavior spec governs CLI, skill, and entrypoint code.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/behavior/cli.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "./vcsinstall/cli/**/*.py" },
  { type = "files", pattern = "./vcsinstall/skills/**/*.py" },
  { type = "files", pattern = "./vcsinstall/skills/**/*.md" },
  { type = "list", artifacts = ["./vcsinstall/__init__.py", "./vcsinstall/__main__.py"] },
] }

# Built-in skill fixtures are governed by the skill fixture behavior spec.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "./vcsinstall/skills/fixtures/*.md" }
output = { type = "list", artifacts = ["./specs/behavior/skill_fixtures.md"] }

# The skill fixture behavior spec governs built-in skill fixtures.
[[rules]]
