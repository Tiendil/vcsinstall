output = { type = "union", items = [
  { type = "files", pattern = "./vcsinstall/sources/adapters/filesystem.py" },
  { type = "files", pattern = "./vcsinstall/sources/adapters/tests/test_filesystem.py" },
] }

# The noop source adapter follows its source contract.
[[rules]]
