  { type = "files", pattern = "./vcsinstall/sources/adapters/tests/test_noop.py" },
] }

# Native Git hosting also governs GitHub's delegated Git integration.
[[rules]]
relation = "governed_by"
input = { type = "one_of", artifacts = [
  "./vcsinstall/hosting/adapters/git.py",
  "./vcsinstall/hosting/adapters/tests/test_git.py",
  "./vcsinstall/hosting/adapters/github.py",
  "./vcsinstall/hosting/adapters/tests/test_github.py",
  "./specs/behavior/hosting/github.md",
