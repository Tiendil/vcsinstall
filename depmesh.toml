output = { type = "list", artifacts = ["./specs/behavior/hosting/git.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["./specs/behavior/hosting/git.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "./vcsinstall/hosting/adapters/git.py" },
  { type = "files", pattern = "./vcsinstall/hosting/adapters/tests/test_git.py" },
  { type = "files", pattern = "./vcsinstall/hosting/adapters/github.py" },
  { type = "files", pattern = "./vcsinstall/hosting/adapters/tests/test_github.py" },
  { type = "files", pattern = "./specs/behavior/hosting/github.md" },
