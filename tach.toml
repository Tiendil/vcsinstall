source_roots = ["."]
root_module = "ignore"
ignore_type_checking_imports = true
forbid_circular_dependencies = true
layers_explicit_depends_on = true

exclude = [
    ".git/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".session/",
    ".venv/",
    "build/",
    "dist/",
    "**/__pycache__/",
]

layers = ["meta-tests", "cli", "runtime", "support", "workspace", "sources", "filesystem", "domain", "core"]

[[modules]]
path = "vcsinstall"
depends_on = []
visibility = []

[[modules]]
path = "vcsinstall.**.tests"
depends_on = ["vcsinstall.**", "vcsinstall.**.tests"]
layer = "meta-tests"

[[modules]]
path = "vcsinstall.__main__"
depends_on = ["vcsinstall.cli"]
layer = "cli"

[[modules]]
path = "vcsinstall.cli"
depends_on = ["vcsinstall.domain", "vcsinstall.skills", "vcsinstall.runtime", "vcsinstall.workspace"]
layer = "cli"

[[modules]]
path = "vcsinstall.skills"
depends_on = []
layer = "support"

[[modules]]
path = "vcsinstall.runtime"
depends_on = ["vcsinstall.domain", "vcsinstall.workspace"]
layer = "runtime"

[[modules]]
path = "vcsinstall.sources"
depends_on = ["vcsinstall.core", "vcsinstall.domain"]
layer = "sources"

[[modules]]
path = "vcsinstall.workspace"
depends_on = ["vcsinstall.core", "vcsinstall.domain", "vcsinstall.filesystem", "vcsinstall.sources"]
layer = "workspace"

[[modules]]
path = "vcsinstall.filesystem"
depends_on = ["vcsinstall.domain"]
layer = "filesystem"

[[modules]]
path = "vcsinstall.domain"
depends_on = []
layer = "domain"

[[modules]]
path = "vcsinstall.core"
depends_on = []
layer = "core"

[external]
exclude = ["pytest", "pytest_mock", "tach", "typer"]

[rules]
unused_ignore_directives = "warn"
require_ignore_directive_reasons = "off"
